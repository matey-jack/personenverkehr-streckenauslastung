name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a running deployment finish; only the newest waiting one follows it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Write the HTML reports
        working-directory: pipeline
        run: ./gradlew hubStations lines longDistanceStations

      # The hub stations page is the start page of the site.
      - name: Collect the HTML reports
        run: |
          mkdir site
          cp pipeline/data/reports/*.html site/
          mv site/hub_stations.html site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
