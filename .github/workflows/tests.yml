name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch/PR when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies and validates the wrapper JAR's checksum.
      - uses: gradle/actions/setup-gradle@v6

      # ktlint, compiler with warnings as errors, and unit tests.
      - name: Lint, compile and test
        run: ./gradlew check

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test/
            build/reports/ktlint/
